<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#0b1440;--mut:#5b6590;--ln:#d5ddf0;--ac:#1b8fe0;--nav:#000c61;--ok:#1f9d55;--in:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050a2e;--card:#0c1550;--tx:#eaf0ff;--mut:#9aa6d6;--ln:#1e2a75;--ac:#4cb8ff;--in:#07104a}}
:root[data-theme="dark"]{--bg:#050a2e;--card:#0c1550;--tx:#eaf0ff;--mut:#9aa6d6;--ln:#1e2a75;--ac:#4cb8ff;--in:#07104a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#000c61;display:flex;justify-content:center;padding:10px;border-bottom:4px solid #3db4f5}
header img{height:64px;max-width:100%}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font-size:15px;color:var(--mut);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,12,97,.08)}
.card.next{border-left-color:var(--ac);box-shadow:0 4px 16px rgba(27,143,224,.28)}
.card.go{border-left-color:#f59e0b}.card.ok{border-left-color:var(--ok);opacity:.75}.badge.go{background:#f59e0b}.badge.ok{background:var(--ok)}
.badge{display:inline-block;background:var(--ac);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;margin-bottom:6px}
.when{font-weight:700;font-size:18px;text-transform:capitalize}
.who{color:var(--mut);font-size:14px}
.task{margin:8px 0;white-space:pre-wrap}
.addr{font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;text-decoration:none;cursor:pointer;display:inline-block}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.red{background:#d33;color:#fff}
select,input,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--in);color:var(--tx);margin-bottom:8px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
.row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.ck{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--tx);border:2px solid var(--ln);border-radius:99px;padding:6px 14px 6px 6px;margin:0;cursor:pointer;background:var(--card)}.ck input{display:none}.ck i{width:30px;height:30px;border-radius:50%;background:var(--ln);color:var(--mut);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px}.ck.on{border-color:var(--ac);background:rgba(61,180,245,.15)}.ck.on i{background:var(--ac);color:#fff}.pill{display:inline-block;background:rgba(61,180,245,.18);color:var(--ac);border-radius:99px;padding:2px 10px;margin-right:6px;font-weight:600;font-size:13px}
#msg{color:#d33;font-size:14px;margin:6px 0}
button{transition:transform .12s,opacity .12s}button:active{transform:scale(.95)}.card{transition:transform .12s,box-shadow .12s}.card:active{transform:scale(.99)}
.btns>button{flex:1 1 auto}button.fin{background:var(--ok)}button.go{background:#f59e0b}button.cn{background:transparent;color:#d33;border:1px solid #d33}
.card.cx{border-left-color:#d33;opacity:.75}.badge.cx{background:#d33}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}.meta.ok>span:first-child{opacity:.6}.mb{display:flex;gap:6px}.mb button{padding:8px 12px}
.card{cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,8,40,.72);z-index:20;overflow-y:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.pn{background:var(--card);color:var(--tx);max-width:640px;margin:0 auto;border-radius:20px;padding:22px;border-left:8px solid var(--ac)}
.dtb{font-size:15px;font-weight:800;color:var(--ac);letter-spacing:.04em;margin-bottom:6px}
.dwhen{font-size:28px;font-weight:800;line-height:1.2;text-transform:capitalize;margin-bottom:16px}
.dl{font-size:14px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:16px}
.dv{font-size:22px;line-height:1.45;font-weight:500;white-space:pre-wrap;word-break:break-word}
.pn .btns button{font-size:19px;padding:16px 18px}
</style>

<script>

const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(txt,cls,fn){const b=el('button',cls,txt);b.onclick=fn;return b}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return new Date(d+'T00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}
function note(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1f9d55;color:#fff;padding:14px;border-radius:12px;z-index:9;font-weight:600';document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
const nm=x=>(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const joinN=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1];
// serviços "gêmeos": mesma data, mesmo endereço e mesma tarefa (ex.: 2 funcionários no mesmo serviço lançado em separado)
function grp(s){const k=x=>x.date+'|'+nm(x.addr)+'|'+nm(x.task);return D.services.filter(x=>x.id===s.id||(!x.cancel&&k(x)===k(s)))}
const names=g=>[...new Set(g.flatMap(WK))];
function addN(tipo,txt){const n={id:String(Date.now()),tipo:tipo,por:filter,txt:txt,em:new Date().toISOString(),lido:false};D.notifs.push(n);if(D.notifs.length>100)D.notifs=D.notifs.slice(-100);return n}
function rmN(n){D.notifs=D.notifs.filter(x=>x!==n)}
async function goWA(s){
  const g=grp(s).filter(x=>!x.done),ns=names(g.length?g:[s]);
  const n=addN('go',joinN(ns)+(ns.length>1?' estão':' está')+' a caminho — '+(s.client||'cliente')+', '+s.addr);
  if(await save())note('🚗 Henrique foi avisado que você está a caminho.');else rmN(n);
}
async function finishSvc(s){
  const g=grp(s),ns=names(g),prev=g.map(x=>[x,x.done,x.st]);
  const txt=joinN(ns)+(ns.length>1?' finalizaram':' finalizou')+' o serviço de '+(s.client||'cliente')+' — '+s.addr+' ('+fmt(s.date)+(s.time?' às '+s.time:'')+')';
  g.forEach(x=>{x.done=true;x.st=''});
  const n=addN('fin',txt);
  if(!(await save())){prev.forEach(([x,d,t])=>{x.done=d;x.st=t});rmN(n);render();return}
  note('✅ Serviço finalizado! Henrique foi avisado.');
}
function placeDesc(s){return s.tp==='apto'?'🏢 Apartamento'+(s.bl?' · Bloco '+s.bl:'')+(s.ap?' · Apto '+s.ap:''):s.tp==='emp'?'🏬 Empresa':s.tp==='casa'?'🏠 Casa':''}
function closeDetail(){const o=$('ov');if(o)o.remove()}
function openDetail(s){
  closeDetail();
  const ov=el('div','ov');ov.id='ov';ov.onclick=e=>{if(e.target===ov)closeDetail()};
  const p=el('div','pn');
  p.appendChild(el('div','dtb',s.cancel?'🚫 CANCELADO':s.done?'✅ CONCLUÍDO':'⏳ PENDENTE'));
  p.appendChild(el('div','dwhen','🕐 '+fmt(s.date)+(s.time?' · '+s.time:'')));
  [['Funcionários','👷 '+WK(s).join(', ')],['Cliente',s.client?'🏠 '+s.client:''],['Endereço','📍 '+s.addr],['Local',placeDesc(s)],['O que fazer',s.task],
   ['Motivo do cancelamento',s.cancel?s.cancel.motivo+(s.cancel.por?' ('+s.cancel.por+')':''):'']].forEach(([l,v])=>{
    if(!v)return;p.appendChild(el('div','dl',l));p.appendChild(el('div','dv',v))});
  const b=el('div','btns');b.style.marginTop='22px';
  if(!isAdmin()&&!s.done&&!s.cancel){
    b.appendChild(btn('🚗 A caminho','go',()=>{closeDetail();goWA(s)}));
    b.appendChild(btn('✅ Finalizado','fin',()=>{closeDetail();finishSvc(s)}));
  }
  b.appendChild(btn('Fechar','sec',closeDetail));
  p.appendChild(b);ov.appendChild(p);document.body.appendChild(ov);
}
function fail(t){const m=$('msg');if(m)m.textContent=t;const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#d33;color:#fff;padding:14px;border-radius:12px;z-index:9;font-weight:600';document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
async function save(){
  if(!art){fail('Para salvar, abra este link logado na sua conta Claude.');return false}
  const json=JSON.stringify(D).replace(/</g,'\\u003c');
  const html=SRC.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
  try{await art.publish(html);return true}catch(e){if(!e||e.code!=='conflict')fail('Não foi possível salvar. Avise o Henrique que o serviço foi finalizado.');return false}
}
function card(s,isNext){
  const c=el('div','card '+(s.cancel?'cx':s.done?'ok':s.st==='go'?'go':'')+(isNext?' next':''));
  if(s.cancel)c.appendChild(el('div','badge cx','🚫 CANCELADO'));
  else if(s.done)c.appendChild(el('div','badge ok','✅ CONCLUÍDO'));
  else if(s.st==='go')c.appendChild(el('div','badge go','🚗 A CAMINHO'));
  else if(isNext)c.appendChild(el('div','badge','PRÓXIMO SERVIÇO'));
  c.appendChild(el('div','when','🕐 '+fmt(s.date)+(s.time?' · '+s.time:'')));
  {const w=el('div','who');WK(s).forEach(n=>w.appendChild(el('span','pill','👷 '+n)));if(s.client)w.appendChild(el('span',null,'🏠 '+s.client));c.appendChild(w)}
  c.appendChild(el('div','task',s.task));
  c.appendChild(el('div','addr','📍 '+s.addr));
  const dt=placeDesc(s);
  if(dt)c.appendChild(el('div','who',dt));
  if(s.cancel)c.appendChild(el('div','task','🚫 Motivo: '+s.cancel.motivo+(s.cancel.por?' ('+s.cancel.por+')':'')));
  const b=el('div','btns');

  if(isAdmin()){
    b.appendChild(btn('✏️ Editar','sec',()=>startEdit(s)));
    b.appendChild(btn(s.done||s.cancel?'Reabrir':'✅ Concluir','sec',()=>{if(s.cancel)delete s.cancel;else{s.done=!s.done;if(s.done)s.st=''}save()}));
    b.appendChild(btn(confirmId===s.id?'Confirmar exclusão':'Excluir',confirmId===s.id?'red':'sec',()=>{
      if(confirmId===s.id){D.services=D.services.filter(x=>x.id!==s.id);save()}else{confirmId=s.id;render()}}));
  }
  if(!isAdmin()&&!s.done&&!s.cancel)b.appendChild(btn('🚗 A caminho','go',()=>goWA(s)));
  if(!isAdmin()&&!s.done&&!s.cancel)b.appendChild(btn('✅ Finalizado','fin',()=>finishSvc(s)));
  if(!s.done&&!s.cancel)b.appendChild(btn('🚫 Cancelar','cn',()=>{cancelId=s.id;render()}));
  c.appendChild(b);
  c.title='Toque para ver os detalhes';
  c.onclick=e=>{if(e.target.closest('button,textarea,select,input'))return;openDetail(s)};
  if(cancelId===s.id&&!s.cancel){
    const ta=el('textarea');ta.placeholder='Explique o motivo do cancelamento';ta.rows=3;ta.value=cancelTxt;ta.oninput=()=>{cancelTxt=ta.value};c.appendChild(ta);
    const r=el('div','btns');
    r.appendChild(btn('Confirmar cancelamento','red',async()=>{const t=ta.value.trim();if(t.length<3){fail('Escreva o motivo do cancelamento.');return}s.cancel={motivo:t,por:filter,em:today()};cancelId='';cancelTxt='';const n=addN('cx',filter+' cancelou o serviço de '+(s.client||'cliente')+' — '+s.addr+'\nMotivo: '+t);if(!(await save())){delete s.cancel;rmN(n)}}));
    r.appendChild(btn('Voltar','sec',()=>{cancelId='';render()}));
    c.appendChild(r);
  }
  return c;
}
function render(){
  const sel=$('who');sel.textContent='';
  const o0=el('option',null,'Escolha seu nome');o0.value='';sel.appendChild(o0);
  NAMES.forEach(n=>{const o=el('option',null,n);o.value=n;sel.appendChild(o)});
  if(!NAMES.includes(filter))filter='';
  sel.value=filter;
  sel.onchange=()=>{filter=sel.value;confirmId='';try{localStorage.setItem('cr12f',filter)}catch(e){}render()};
  renderLogin();
  renderAdmin();
  renderMetas();
  const L=$('list');L.textContent='';
  if(!filter){L.appendChild(el('div','empty','Escolha seu nome para ver seus serviços.'));return}
  if(filter==='Henrique'&&!admin)return;
  if(filter==='Henrique'){
    const tb=el('div','tabs');
    [['s','📋 Serviços'],['e','👥 Equipe'],['n','🔔 Avisos'+(D.notifs.some(n=>!n.lido)?' ('+D.notifs.filter(n=>!n.lido).length+')':'')]].forEach(([k,t])=>tb.appendChild(btn(t,tab===k?null:'sec',()=>{tab=k;render()})));
    L.appendChild(tb);
    if(tab==='e'){renderTeam(L);return}
    if(tab==='n'){renderNotifs(L);return}
  }
  if(filter==='Henrique'){
    const bar=el('div','row');
    const mk=(opts,val,fn)=>{const d=el('div');const s=el('select');opts.forEach(([v,t])=>{const o=el('option',null,t);o.value=v;s.appendChild(o)});s.value=val;s.onchange=()=>fn(s.value);d.appendChild(s);return d};
    bar.appendChild(mk([['','Todos status'],['p','Pendentes'],['c','Concluídos']],sf,v=>{sf=v;render()}));
    L.appendChild(bar);
    const t=D.services.length,k=D.services.filter(x=>x.done).length,cc=D.services.filter(x=>x.cancel).length;
    L.appendChild(el('div','who','📋 '+t+' serviços · ⏳ '+(t-k-cc)+' pendentes · ✅ '+k+' concluídos · 🚫 '+cc+' cancelados'));
  }
  const all=D.services.filter(s=>(filter==='Henrique'?(!wf||WK(s).includes(wf)):WK(s).includes(filter))&&(filter!=='Henrique'||!sf||(sf==='c')===!!(s.done||s.cancel))).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const open=all.filter(s=>!s.done&&!s.cancel),done=all.filter(s=>s.done||s.cancel).reverse().slice(0,10);
  if(!open.length)L.appendChild(el('div','empty','Nenhum serviço pendente. 👍'));
  open.forEach((s,i)=>{if(i===1)L.appendChild(el('h2',null,'Depois'));L.appendChild(card(s,i===0))});
  if(done.length){L.appendChild(el('h2',null,'Finalizados e cancelados'));done.forEach(s=>L.appendChild(card(s,false)))}
  renderAdmin();
}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\s-]+/g,'');
function renderLogin(){
  const g=$('login');g.textContent='';
  if(filter!=='Henrique'||admin)return;
  const c=el('div','card');c.appendChild(el('div','when','🔒 Entrar'));
  c.appendChild(field('Usuário','text','l_u'));c.appendChild(field('Senha','password','l_p'));
  c.appendChild(el('div',null)).id='lmsg';
  c.appendChild(btn('Entrar',null,()=>{
    if(norm($('l_u').value)===norm('henrique2026')&&$('l_p').value.trim()==='rick170409'){
      admin=true;try{localStorage.setItem('cr12a','1')}catch(e){}render();
    }else $('lmsg').textContent='Usuário ou senha incorretos.';
  }));
  g.appendChild(c);
}
function renderNotifs(L){
  const un=D.notifs.filter(n=>!n.lido).length;
  L.appendChild(el('h2',null,'🔔 Avisos'+(un?' · '+un+' novo'+(un>1?'s':''):'')));
  const bar=el('div','btns');
  bar.appendChild(btn('Marcar todos como lidos','sec',()=>{D.notifs.forEach(n=>n.lido=true);save().then(render)}));
  bar.appendChild(btn(confirmId==='nclr'?'Confirmar limpeza':'Limpar tudo',confirmId==='nclr'?'red':'sec',()=>{if(confirmId==='nclr'){D.notifs=[];confirmId='';save().then(render)}else{confirmId='nclr';render()}}));
  L.appendChild(bar);
  if(!D.notifs.length){L.appendChild(el('div','empty','Nenhum aviso por enquanto.'));return}
  const T={go:['🚗 A CAMINHO','go'],fin:['✅ FINALIZADO','ok'],cx:['🚫 CANCELADO','cx']};
  [...D.notifs].reverse().forEach(n=>{
    const t=T[n.tipo]||['AVISO',''];
    const c=el('div','card '+(t[1]==='ok'?'':t[1]));c.style.cursor='default';c.style.marginTop='10px';
    if(t[1]==='ok')c.style.borderLeftColor='var(--ok)';
    if(!n.lido)c.style.boxShadow='0 4px 16px rgba(27,143,224,.35)';
    c.appendChild(el('div','when',t[0]+(n.lido?'':' · NOVO')));
    c.appendChild(el('div','who','🕐 '+new Date(n.em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(n.por?' · 👷 '+n.por:'')));
    c.appendChild(el('div','task',n.txt));
    L.appendChild(c)});
}
function renderTeam(L){
  L.appendChild(el('h2',null,'👥 Equipe'));
  [...NAMES.filter(n=>n!=='Henrique'),...NAMES.filter(n=>n==='Henrique')].forEach(n=>{
    const mine=D.services.filter(s=>WK(s).includes(n));
    const pend=mine.filter(s=>!s.done&&!s.cancel).length,ok=mine.filter(s=>s.done).length,can=mine.filter(s=>s.cancel).length;
    const mt=D.metas.filter(m=>m.worker===n),mk=mt.filter(m=>m.done).length;
    const c=el('div','card');
    c.appendChild(el('div','when','👷 '+n));
    c.appendChild(el('div','who','⏳ '+pend+' pendentes · ✅ '+ok+' concluídos · 🚫 '+can+' cancelados'));
    if(n!=='Henrique')c.appendChild(el('div','who','🎯 Metas: '+mk+'/'+mt.length));
    const b=el('div','btns');
    if(n!=='Henrique'){const k='t'+n;b.appendChild(btn(confirmId===k?'Confirmar remoção':'Remover da equipe',confirmId===k?'red':'sec',()=>{if(confirmId===k){D.team=D.team.filter(x=>x!==n);save()}else{confirmId=k;render()}}))}
    c.appendChild(b);L.appendChild(c)});
  const c=el('div','card');c.appendChild(el('div','when','➕ Novo funcionário'));
  const i=el('input');i.placeholder='Nome do funcionário';c.appendChild(i);
  c.appendChild(btn('Adicionar à equipe',null,()=>{const t=i.value.trim();if(!t||NAMES.includes(t))return;D.team.push(t);save()}));
  L.appendChild(c);
}
function renderMetas(){
  const M=$('metas');M.textContent='';
  if(!filter||(filter==='Henrique'&&(!admin||tab!=='e')))return;
  const isH=filter==='Henrique';
  const mine=D.metas.filter(m=>isH?true:m.worker===filter);
  M.appendChild(el('h2',null,'🎯 Metas'+(isH?' dos funcionários':'')));
  if(!mine.length)M.appendChild(el('div','empty','Nenhuma meta por enquanto.'));
  (isH?NAMES.filter(n=>n!=='Henrique'):[filter]).forEach(n=>{
    const items=mine.filter(m=>m.worker===n);
    if(!items.length)return;
    const c=el('div','card');
    c.appendChild(el('div','when','👷 '+n+' · '+items.filter(m=>m.done).length+'/'+items.length));
    items.forEach(m=>{
      const r=el('div','meta'+(m.done?' ok':''));
      r.appendChild(el('span',null,(m.done?'✅ ':'⬜ ')+m.text));
      if(isH){const b=el('span','mb');
        b.appendChild(btn(m.done?'Desfazer':'Bateu','sec',()=>{m.done=!m.done;save()}));
        b.appendChild(btn('✕','sec',()=>{D.metas=D.metas.filter(x=>x.id!==m.id);save()}));
        r.appendChild(b)}
      c.appendChild(r)});
    M.appendChild(c)});
  if(isH){
    const c=el('div','card');c.appendChild(el('div','when','➕ Nova meta'));
    const s=el('select');s.id='m_w';NAMES.filter(n=>n!=='Henrique').forEach(n=>{const o=el('option',null,n);o.value=n;s.appendChild(o)});c.appendChild(s);
    const i=el('input');i.id='m_t';i.placeholder='Ex.: 5 limpezas na semana';c.appendChild(i);
    c.appendChild(btn('Adicionar meta',null,()=>{const t=$('m_t').value.trim();if(!t)return;D.metas.push({id:String(Date.now()),worker:$('m_w').value,text:t,done:false});save()}));
    M.appendChild(c)}
}
function startEdit(s){
  editId=s.id;
  const m={f_d:s.date,f_t:s.time||'',f_c:s.client||'',f_a:s.addr,f_k:s.task,f_tp:s.tp||'casa',f_bl:s.bl||'',f_ap:s.ap||''};
  for(const k in m)$(k).value=m[k];
  $('f_w').querySelectorAll('input').forEach(i=>{i.checked=WK(s).includes(i.value);i.parentNode.classList.toggle('on',i.checked)});
  $('f_tp').onchange();
  $('f_h').textContent='✏️ Editando serviço';
  $('admin').scrollIntoView({behavior:'smooth'});
}
function field(lbl,type,id,val){const d=el('div');d.appendChild(el('label',null,lbl));const i=el(type==='textarea'?'textarea':'input');if(type!=='textarea')i.type=type;i.id=id;if(val)i.value=val;if(type==='textarea')i.rows=3;d.appendChild(i);return d}
function renderAdmin(){
  const A=$('admin');A.style.display=isAdmin()&&tab==='s'?'':'none';if(!isAdmin()||A.dataset.on)return;A.dataset.on='1';
  const c=el('div','card');c.appendChild(el('div','when','➕ Novo serviço')).id='f_h';
  {const d=el('div');d.appendChild(el('label',null,'Funcionários (marque quem vai)'));const g=el('div','chk');g.id='f_w';
  NAMES.forEach(n=>{const l=el('label','ck');const i=el('input');i.type='checkbox';i.value=n;i.onchange=()=>l.classList.toggle('on',i.checked);l.appendChild(i);l.appendChild(el('i',null,n.split(' ').map(w=>w[0]).join('')));l.appendChild(document.createTextNode(n));g.appendChild(l)});d.appendChild(g);c.appendChild(d)}
  const r=el('div','row');r.appendChild(field('Data','date','f_d',today()));r.appendChild(field('Hora','time','f_t'));c.appendChild(r);
  c.appendChild(field('Cliente / quem mora','text','f_c'));
  {const ap=el('div','row');ap.style.display='none';
  ap.appendChild(field('Bloco','text','f_bl'));ap.appendChild(field('Nº do apartamento','text','f_ap'));
  const d=el('div');d.appendChild(el('label',null,'Tipo do local'));const s=el('select');s.id='f_tp';
  [['casa','🏠 Casa'],['apto','🏢 Apartamento'],['emp','🏬 Empresa']].forEach(([v,t])=>{const o=el('option',null,t);o.value=v;s.appendChild(o)});
  s.onchange=()=>{ap.style.display=s.value==='apto'?'':'none'};
  d.appendChild(s);c.appendChild(d);c.appendChild(ap)}
  c.appendChild(field('Endereço','text','f_a'));
  c.appendChild(field('O que fazer','textarea','f_k'));
  c.appendChild(el('div',null)).id='msg';
  c.appendChild(btn('Enviar serviço',null,()=>{
    const v=i=>$(i).value.trim();
    if(!$('f_w').querySelector('input:checked')||!v('f_d')||!v('f_a')||!v('f_k')){$('msg').textContent='Preencha funcionário, data, endereço e o que fazer.';return}
    const ws=[...$('f_w').querySelectorAll('input:checked')].map(i=>i.value);const o={worker:ws[0],workers:ws,date:v('f_d'),time:v('f_t'),client:v('f_c'),addr:v('f_a'),task:v('f_k'),tp:v('f_tp'),bl:v('f_bl'),ap:v('f_ap')};
    const cur=D.services.find(x=>x.id===editId);
    if(cur)Object.assign(cur,o);else D.services.push({id:String(Date.now()),done:false,...o});
    save();
  }));
  A.appendChild(c);
}
render();
(async()=>{
  try{
    const u=await claude.use('user');owner=!!(u&&await u.isOwner());
    art=await claude.use('artifact');
    render();
  }catch(e){}
})();
